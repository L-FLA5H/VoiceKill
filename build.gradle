plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
    maven {
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.k2-fsa.sherpa-onnx' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Mojang 官方映射：player.kill() / player.damageSources() 这些名字才存在
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 语音识别（Shriek 自身依赖 Architectury，必须一起装）
    modImplementation "maven.modrinth:shriek:${project.shriek_version}"
    modImplementation "maven.modrinth:architectury-api:${project.architectury_version}"
    // JVM API 与三个目标平台的 JNI，模型权重独立缓存，不打进模组。
    ['sherpa-onnx-jvm', 'sherpa-onnx-native-lib-win-x64',
     'sherpa-onnx-native-lib-osx-x64', 'sherpa-onnx-native-lib-osx-aarch64'].each { artifact ->
        def coordinate = "com.github.k2-fsa.sherpa-onnx:${artifact}:1.13.5"
        implementation coordinate
        include coordinate
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test') { useJUnitPlatform() }

// 只读音频回放基准：不启动游戏、不打开麦克风。
tasks.register('benchmarkAsr', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.voicekill.client.ModelBenchmark'
    args project.findProperty('zipformerDir') ?: '.local/models/zipformer-bilingual-small',
         project.findProperty('audioDir') ?: '.local/models/zipformer-bilingual-small',
         project.findProperty('voskDir') ?: '',
         project.findProperty('benchmarkOutput') ?: '.local/diagnostics/sherpa/benchmark.json'
}

tasks.register('prepareAsrModel', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.voicekill.client.SpeechModels'
    args project.findProperty('zipformerDir') ?: '.local/models/zipformer-bilingual-small'
}

tasks.register('replayNicknames', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.voicekill.client.NicknameReplay'
    args project.findProperty('zipformerDir') ?: '.local/models/zipformer-bilingual-small',
         project.findProperty('corpusDir') ?: '.local/diagnostics/nickname-replay/corpus',
         project.findProperty('replayRounds') ?: '3',
         project.findProperty('replayOutput') ?: '.local/diagnostics/nickname-replay/results.json',
         project.findProperty('replayEngine') ?: 'zipformer',
         project.findProperty('replayWords') ?: '',
         project.findProperty('replayRealtime') ?: 'true',
         project.findProperty('replayClips') ?: ''
}

tasks.register('probeDecoder', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.voicekill.client.DecoderAblation'
    args project.findProperty('probeCorpus') ?: '.local/diagnostics/nickname-replay/corpus',
         project.findProperty('probeOutput') ?: '.local/diagnostics/nickname-replay/optimization/ablation.json',
         project.findProperty('probeStage') ?: 'recognition',
         project.findProperty('zipformerDir') ?: '.local/models/zipformer-bilingual-small',
         project.findProperty('probeWords') ?: ''
}

tasks.register('probeSenseVoice', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.voicekill.client.SenseVoiceProbe'
    if (project.hasProperty('probeCorpus')) args project.property('probeCorpus'), project.property('probeOutput'), project.findProperty('probeWords') ?: ''
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// ---------------------------------------------------------------------------
// 构建完自动把 jar 丢进游戏 mods 文件夹
// 路径在 gradle.properties 的 game_mods_dir 里改
// ---------------------------------------------------------------------------
tasks.register('deployToGame') {
    group = 'deployment'
    description = '把构建产物复制到游戏 mods 目录（会先删掉旧的 voicekill-*.jar）'
    dependsOn tasks.named('remapJar')

    doLast {
        def rawPath = project.findProperty('game_mods_dir')
        if (!rawPath) {
            logger.warn('[deploy] gradle.properties 里没有 game_mods_dir，跳过')
            return
        }
        def targetDir = new File(rawPath as String)
        if (!targetDir.isDirectory()) {
            logger.warn("[deploy] mods 目录不存在，跳过：${targetDir}")
            return
        }

        def built = tasks.named('remapJar').get().archiveFile.get().asFile
        if (!built.isFile()) {
            logger.warn('[deploy] 没找到构建产物，跳过')
            return
        }

        // 先删旧的，避免同一个模组放了两个版本
        targetDir.listFiles()?.each { f ->
            if (f.isFile()
                    && f.name.toLowerCase().startsWith(project.archives_base_name.toString().toLowerCase())
                    && f.name.toLowerCase().endsWith('.jar')) {
                if (f.delete()) {
                    logger.lifecycle("[deploy] 删除旧版本：${f.name}")
                } else {
                    // 游戏开着的时候 jar 被占用，删不掉 —— 这时候 mods 里会出现两个同名模组，Fabric 会报错
                    logger.warn("[deploy] 删不掉 ${f.name}！游戏是不是开着？"
                            + "关掉游戏再构建，否则 mods 里会同时存在两个版本")
                }
            }
        }

        copy {
            from built
            into targetDir
        }
        logger.lifecycle("[deploy] 已部署：${new File(targetDir, built.name)}")
    }
}

tasks.named('build') {
    finalizedBy 'deployToGame'
}
