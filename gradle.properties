# ===== Gradle =====
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ===== Minecraft / Fabric =====
# 1.21.11 是最后一个「有混淆」的版本，下一版直接叫 26.1
minecraft_version=1.21.11
loader_version=0.19.5
loom_version=1.14.10

# ===== 依赖 =====
fabric_version=0.141.6+1.21.11
shriek_version=1.1.22+fabric
architectury_version=19.0.1+fabric

# ===== 模组自身 =====
mod_version=1.0.15-dev.5
maven_group=com.example
archives_base_name=voicekill

